; ============================================================
;  Obsidian ノート整理ツール　設定ファイル
;  「;」で始まる行は説明文（メモ）なので、動作には影響しません。
;  書き換えたら、上書き保存（Ctrl + S）してください。
; ============================================================

[基本]
; あなたの Obsidian 保管庫（ノートが入っているフォルダ）の場所
保管庫フォルダ = C:\Obsidian

; 提案レポートを出力するフォルダ（保管庫の外にしてください）
; 「レポート」のように書くと、このツールのフォルダの中に作られます
レポートフォルダ = レポート

; 適用モードの前に取るバックアップの保存先（保管庫の外にしてください）
バックアップフォルダ = バックアップ

[除外]
; 調べないフォルダ（保管庫の中の場所）。カンマ「,」で区切って複数書けます
; 例：除外フォルダ = .obsidian, .trash, テンプレート, 日記
除外フォルダ = .obsidian, .trash, テンプレート

[リンク候補]
; この文字数より短いノート名は、リンク候補として探しません
; （「型」「間」など1文字の名前は、関係ない場所にたくさん見つかってしまうため）
最小文字数 = 2

; リンク候補として探さないノート名。カンマ「,」で区切って複数書けます
; 例：除外する名前 = メモ, まとめ, 未分類
除外する名前 =

; レポートで、リンク候補のチェックボックスを最初から入れておくか（はい／いいえ）
初期状態でチェック = はい

[目次]
; ノートがこの数以上あるタグやフォルダについて、目次ノート案を作ります
最小ノート数 = 3

; 目次ノートを作るフォルダ（保管庫の中の場所）
作成先フォルダ = 目次

; レポートで、目次ノート案のチェックボックスを最初から入れておくか（はい／いいえ）
初期状態でチェック = いいえ

[レポート]
; レポート内のノート名を、クリックで Obsidian が開くリンクにするか（はい／いいえ）
Obsidianで開くリンクを付ける = はい

; レポート作成後に、レポートフォルダを自動で開くか（はい／いいえ）
完了後にフォルダを開く = はい
